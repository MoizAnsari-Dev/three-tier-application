global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Docker Container Metrics (cAdvisor) ───────────────────────
  # Shows per-container CPU, RAM, network, disk usage
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # ── Host / Server Metrics (Node Exporter) ─────────────────────
  # Shows server CPU, RAM, disk, network
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # ── Redis Metrics ─────────────────────────────────────────────
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # ── MongoDB Metrics ───────────────────────────────────────────
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
